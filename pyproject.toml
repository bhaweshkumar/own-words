[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coach"
version = "0.1.0"
description = "A mock interview coach that scores content and English separately and explains the critique in your first language"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "pydantic",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
