[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "own-words"
version = "0.1.0"
description = "An interview coach that never puts words in your mouth: scores content and English separately, explains the critique in your first language, and proves you improved"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "pydantic",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
